version: '3.8'

services:
  # PostgreSQL + PGVector
  postgres:
    image: ankane/pgvector:latest
    container_name: spring-ai-postgres
    environment:
      POSTGRES_DB: spring_ai_dev_kit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - spring-ai-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: spring-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - spring-ai-network

  # Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: spring-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - spring-ai-network

  # Spring AI Dev Kit
  spring-ai-dev-kit:
    build: .
    container_name: spring-ai-dev-kit
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spring_ai_dev_kit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - postgres
      - redis
      - ollama
    networks:
      - spring-ai-network

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: spring-ai-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring-ai-dev-kit
    networks:
      - spring-ai-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  spring-ai-network:
    driver: bridge

