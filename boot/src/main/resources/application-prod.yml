# ==================== 生产环境配置 ====================
# 本配置文件用于生产环境部署

server:
  port: 8080
  # 生产环境启用压缩
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  application:
    name: spring-ai-dev-kit-prod
  
  # ==================== Spring AI 配置 ====================
  ai:
    # Ollama 配置
    ollama:
      base-url: ${OLLAMA_BASE_URL}  # 生产环境必须配置
      chat:
        enabled: true
        options:
          model: ${OLLAMA_MODEL:qwen2.5:7b}
          temperature: 0.7
          max-tokens: 2000
    
    # OpenAI 配置
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        enabled: false
    
    # 向量数据库配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: false  # 生产环境不自动初始化

  # ==================== 数据源配置 ====================
  datasource:
    url: ${DB_URL}  # 生产环境必须配置
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20  # 生产环境较大的连接池
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: none  # 生产环境不自动修改表结构
    show-sql: false  # 生产环境不显示 SQL

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

# ==================== MCP 工具配置 ====================
mcp:
  tools:
    elk:
      enabled: ${MCP_ELK_ENABLED:true}
      base-url: ${ELK_BASE_URL}
      username: ${ELK_USERNAME}
      password: ${ELK_PASSWORD}
      index-pattern: ${ELK_INDEX_PATTERN:logs-*}
      connect-timeout: 5000
      read-timeout: 30000
    
    prometheus:
      enabled: ${MCP_PROMETHEUS_ENABLED:true}
      base-url: ${PROMETHEUS_BASE_URL}
      username: ${PROMETHEUS_USERNAME:}
      password: ${PROMETHEUS_PASSWORD:}
      connect-timeout: 5000
      read-timeout: 30000
    
    sql-report:
      enabled: ${MCP_SQL_REPORT_ENABLED:true}
      datasource-url: ${REPORT_DB_URL:}
      datasource-username: ${REPORT_DB_USERNAME:}
      datasource-password: ${REPORT_DB_PASSWORD:}
      export-dir: ${REPORT_EXPORT_DIR:/data/reports}  # 生产环境使用绝对路径
      max-rows: 10000
      query-timeout: 60

# ==================== Swagger 配置 ====================
springdoc:
  api-docs:
    enabled: false  # 生产环境关闭 API 文档
  swagger-ui:
    enabled: false  # 生产环境关闭 Swagger UI

# ==================== 日志配置 ====================
logging:
  level:
    root: WARN  # 生产环境只记录警告和错误
    com.springai: INFO
    org.springframework.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/spring-ai-dev-kit/application.log  # 生产环境日志文件
    max-size: 100MB
    max-history: 30
    total-size-cap: 10GB

# ==================== 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

