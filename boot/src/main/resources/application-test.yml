# ==================== 测试环境配置 ====================
# 本配置文件用于测试环境

server:
  port: 8080

spring:
  application:
    name: spring-ai-dev-kit-test
  
  # ==================== Spring AI 配置 ====================
  ai:
    # Ollama 配置
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: true
        options:
          model: ${OLLAMA_MODEL:qwen2.5:7b}
          temperature: 0.7
          max-tokens: 2000
    
    # OpenAI 配置
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        enabled: false
    
    # 向量数据库配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: true  # 测试环境自动初始化

  # ==================== 数据源配置 ====================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spring_ai_dev_kit_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  
  jpa:
    hibernate:
      ddl-auto: create-drop  # 测试环境每次重建表结构
    show-sql: true

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 1  # 测试环境使用不同的数据库

# ==================== MCP 工具配置 ====================
mcp:
  tools:
    elk:
      enabled: ${MCP_ELK_ENABLED:true}
      base-url: ${ELK_BASE_URL:http://localhost:9200}
      username: ${ELK_USERNAME:elastic}
      password: ${ELK_PASSWORD:changeme}
    
    prometheus:
      enabled: ${MCP_PROMETHEUS_ENABLED:true}
      base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
    
    sql-report:
      enabled: ${MCP_SQL_REPORT_ENABLED:true}
      export-dir: ${REPORT_EXPORT_DIR:./test-reports}
      max-rows: 100  # 测试环境限制更小
      query-timeout: 30

# ==================== Swagger 配置 ====================
springdoc:
  api-docs:
    enabled: true  # 测试环境启用 API 文档
  swagger-ui:
    enabled: true

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.springai: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

