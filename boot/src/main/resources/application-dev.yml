# ==================== 开发环境配置 ====================
# 本配置文件用于本地开发环境

server:
  port: 8080

spring:
  application:
    name: spring-ai-dev-kit-dev
  
  # ==================== Spring AI 配置 ====================
  ai:
    # Ollama 本地大模型（开发环境推荐）
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: true
        options:
          model: ${OLLAMA_MODEL:qwen2.5:7b}
          temperature: 0.7
          max-tokens: 2000
    
    # OpenAI（开发环境可选）
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        enabled: false
    
    # 向量数据库配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: true

  # ==================== 数据源配置 ====================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spring_ai_dev_kit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5  # 开发环境较小的连接池
      minimum-idle: 2
  
  jpa:
    hibernate:
      ddl-auto: update  # 开发环境自动更新表结构
    show-sql: true  # 开发环境显示 SQL

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

# ==================== MCP 工具配置 ====================
mcp:
  tools:
    elk:
      enabled: ${MCP_ELK_ENABLED:false}  # 开发环境默认关闭
      base-url: ${ELK_BASE_URL:http://localhost:9200}
      username: ${ELK_USERNAME:elastic}
      password: ${ELK_PASSWORD:changeme}
    
    prometheus:
      enabled: ${MCP_PROMETHEUS_ENABLED:false}  # 开发环境默认关闭
      base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
    
    sql-report:
      enabled: ${MCP_SQL_REPORT_ENABLED:true}
      export-dir: ${REPORT_EXPORT_DIR:./reports}
      max-rows: 1000  # 开发环境限制较小
      query-timeout: 30

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.springai: DEBUG  # 开发环境详细日志
    org.springframework.ai: DEBUG
    org.springframework.ai.chat: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

